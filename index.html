<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2c313a);
scene.fog = new THREE.Fog(0x2c313a, 55, 95);
const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xfff6e0, 0x54503e, 1.05));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(14, 22, 8);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfeaff, 0.5);
fill.position.set(-10, 14, -12);
scene.add(fill);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

/* ---------------- gym ---------------- */
const mat = (c, r = 0.9) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: 0 });
function box(w, h, d, c, x, y, z, r = 0.9) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c, r));
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}
function floorTexture() {
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 1408;
  const c = cv.getContext('2d');
  c.fillStyle = '#d29a58'; c.fillRect(0, 0, 1024, 1408);
  for (let i = 0; i < 16; i++) { // planks across the width
    c.fillStyle = i % 2 ? 'rgba(0,0,0,0.045)' : 'rgba(255,255,255,0.05)';
    c.fillRect(0, i * 88, 1024, 88);
    c.fillStyle = 'rgba(90,50,10,0.35)'; c.fillRect(0, i * 88, 1024, 3);
  }
  for (let i = 0; i < 260; i++) { // wood grain specks
    c.fillStyle = 'rgba(120,70,20,' + (0.04 + Math.random() * 0.06) + ')';
    c.fillRect(Math.random() * 1024, Math.random() * 1408, 30 + Math.random() * 70, 2);
  }
  c.strokeStyle = '#f7f3e8'; c.lineWidth = 7;
  c.strokeRect(71, 211, 882, 1141);                     // boundary = the playable court line (world x ±15.5, z -17.5..23; canvas y grows toward the DOOR: y = (z/50 + 0.5) * 1408)
  c.beginPath(); c.moveTo(71, 704); c.lineTo(953, 704); c.stroke(); // centre line
  c.beginPath(); c.arc(512, 704, 128, 0, Math.PI * 2); c.stroke(); // centre circle
  c.strokeRect(262, 211, 500, 220);                      // key areas (stage end, door end)
  c.strokeRect(262, 1132, 500, 220);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
let doorPivotL = null, doorPivotR = null, doorAngle = 0;
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30.6, 42.5), new THREE.MeshStandardMaterial({ map: floorTexture(), roughness: 0.75 }));
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);
  // walls (chunky, with a wainscot band)
  const wallC = 0xe9e1cd, bandC = 0x8a9a6b;
  box(31.3, 7, 0.68, wallC, 0, 3.5, -21.6);
  box(31.3, 7, 0.68, wallC, 0, 3.5, 21.6);
  box(0.68, 7, 43.9, wallC, -15.6, 3.5, 0);
  box(0.68, 7, 43.9, wallC, 15.6, 3.5, 0);
  box(31.3, 1.1, 0.77, bandC, 0, 0.55, -21.5);
  box(31.3, 1.1, 0.77, bandC, 0, 0.55, 21.5);
  box(0.77, 1.1, 43.9, bandC, -15.6, 0.55, 0);
  box(0.77, 1.1, 43.9, bandC, 15.6, 0.55, 0);
  // high windows on both side walls
  const winM = new THREE.MeshStandardMaterial({ color: 0xbfe0f5, roughness: 0.3, emissive: 0x9fc8e8, emissiveIntensity: 0.55 });
  for (const sx of [-1, 1]) for (let i = 0; i < 4; i++) {
    const w = new THREE.Mesh(new THREE.PlaneGeometry(5.4, 1.9), winM);
    w.position.set(sx * 15.3, 5.2, -15.3 + i * 10.2);
    w.rotation.y = sx > 0 ? -Math.PI / 2 : Math.PI / 2;
    scene.add(w);
  }
  // stage at the far end + curtain with the event name
  box(30.6, 1.0, 3.9, 0x9a7a4e, 0, 0.5, -19.3);
  const ccv = document.createElement('canvas'); ccv.width = 1024; ccv.height = 192;
  const cx = ccv.getContext('2d');
  cx.fillStyle = '#7e1f24'; cx.fillRect(0, 0, 1024, 192);
  for (let i = 0; i < 32; i++) { cx.fillStyle = i % 2 ? 'rgba(0,0,0,0.16)' : 'rgba(255,255,255,0.05)'; cx.fillRect(i * 32, 0, 32, 192); }
  const ctex = new THREE.CanvasTexture(ccv); ctex.colorSpace = THREE.SRGBColorSpace;
  const curtain = new THREE.Mesh(new THREE.PlaneGeometry(25.5, 5.6), new THREE.MeshStandardMaterial({ map: ctex, roughness: 0.95 }));
  curtain.position.set(0, 3.9, -17.3);
  scene.add(curtain);
  box(31.3, 0.9, 0.6, 0x5d171b, 0, 6.9, -17.3); // valance
  // basketball hoops at both ends
  for (const sz of [-1, 1]) {
    box(0.35, 3.9, 0.35, 0x666c74, 0, 1.95, sz * 20.7);
    const board = box(1.9, 1.25, 0.12, 0xf2f2ee, 0, 3.6, sz * 20.1);
    board.material = new THREE.MeshStandardMaterial({ color: 0xf2f2ee, roughness: 0.5 });
    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.045, 8, 20), mat(0xe8641e, 0.5));
    rim.rotation.x = Math.PI / 2;
    rim.position.set(0, 3.15, sz * 19.6);
    scene.add(rim);
  }
  // ceiling beams
  for (let i = 0; i < 5; i++) box(31.3, 0.55, 0.68, 0x4a4238, 0, 7.1, -17 + i * 8.5);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(31.3, 43.9), mat(0x3a3f47, 1));
  ceil.rotation.x = Math.PI / 2; ceil.position.y = 7.45;
  scene.add(ceil);
  // wall clock + exit glow (small set dressing)
  const clock = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.1, 24), mat(0xf5f2e8, 0.4));
  clock.rotation.x = Math.PI / 2; clock.position.set(-6.8, 5.6, -21.2);
  scene.add(clock);
  // entrance door on the front wall (intruders come in here): hinged double doors that swing open
  box(2.2, 3.1, 0.21, 0x7a5c38, 5.1, 1.55, 21.2);
  const doorDark = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 2.9), new THREE.MeshBasicMaterial({ color: 0x14100c }));
  doorDark.position.set(5.1, 1.45, 21.2); doorDark.rotation.y = Math.PI;
  scene.add(doorDark);
  const doorMat = mat(0x96754a, 0.8);
  doorPivotL = new THREE.Group(); doorPivotL.position.set(4.06, 0, 21.2);
  const doorL = new THREE.Mesh(new THREE.BoxGeometry(0.97, 2.9, 0.1), doorMat); doorL.position.set(0.49, 1.45, 0); doorPivotL.add(doorL); scene.add(doorPivotL);
  doorPivotR = new THREE.Group(); doorPivotR.position.set(6.14, 0, 21.2);
  const doorR = new THREE.Mesh(new THREE.BoxGeometry(0.97, 2.9, 0.1), doorMat); doorR.position.set(-0.49, 1.45, 0); doorPivotR.add(doorR); scene.add(doorPivotR);
  box(1.3, 0.42, 0.24, 0x2e9e5b, 5.1, 3.45, 21.2);
}

/* ---------------- kids ---------------- */
const SKINS = [0xf2c79b, 0xe8b184, 0xd99e6a, 0xf6d3a7];
function makeKid(o) {
  // runaway-cheese style: all rounded primitives — capsule torso and limbs, sphere head, no boxes, no face
  const g = new THREE.Group();
  const shirtM = mat(o.shirt, 0.85), shortsM = mat(o.shorts, 0.85), skinM = mat(o.skin, 0.7), hairM = mat(o.hair, 0.95);
  const shoeM = mat(0xf5f5f5, 0.6);
  function limb(r, len, m) { return new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 4, 10), m); }
  function makeLeg(side) {
    const grp = new THREE.Group(); grp.position.set(0.11 * side, 0.52, 0);
    const leg = limb(0.055, 0.35, shortsM); leg.position.y = -0.23; grp.add(leg);
    const shoe = new THREE.Mesh(new THREE.SphereGeometry(0.085, 12, 10), shoeM); shoe.scale.set(1, 0.55, 1.5); shoe.position.set(0, -0.47, 0.03); grp.add(shoe);
    return grp;
  }
  function makeArm(side) {
    const grp = new THREE.Group(); grp.position.set(0.23 * side, 1.06, 0);
    const up = limb(0.045, 0.14, shirtM); up.position.y = -0.11; grp.add(up);
    const fore = limb(0.04, 0.12, skinM); fore.position.y = -0.30; grp.add(fore);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), skinM); hand.position.y = -0.42; grp.add(hand);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), shirtM); cap.position.set(-0.03 * side, 0.02, 0); grp.add(cap);
    return grp;
  }
  const legL = makeLeg(-1), legR = makeLeg(1);
  const armL = makeArm(-1), armR = makeArm(1);
  const torso = limb(0.17, 0.30, shirtM); torso.position.y = 0.84;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 18, 14), skinM); head.position.y = 1.28;
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.185, 18, 10, 0, Math.PI * 2, 0, Math.PI * 0.55), hairM); hair.position.y = 1.305;
  const tailPivot = new THREE.Group(); tailPivot.position.set(0, 0.6, -0.17);
  const ribbon = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.52, 0.045), new THREE.MeshStandardMaterial({ color: o.tailColor, roughness: 0.8, side: THREE.DoubleSide }));
  ribbon.position.y = -0.24;

    if (G.waveQueue && G.waveQueue.list.length && G.waveSeqT >= 0.35) { G.waveSeqT = 0; spawnEntrant(); }
    let stillEntering = false;
    for (const a of G.actors) {
      if (a.entering) {
        stillEntering = true;
        turnToward(a, Math.atan2(a.enterX - a.x, a.enterZ - a.z), a.turn, dt);
        a.speed += clamp(a.enterSpeed - a.speed, -20 * dt, 14 * dt);
        moveActor(a, dt);
        if (Math.hypot(a.enterX - a.x, a.enterZ - a.z) < 0.5) { a.entering = false; a.speed = 0; }
      } else {
        a.runF += (0 - a.runF) * Math.min(1, dt * 8);
      }
    }
    if ((!G.waveQueue || !G.waveQueue.list.length) && !stillEntering) { G.intro = false; G.annT = 1.2; G.resumeHold = 0.9; } // camera back to the game view, then a small pause before play resumes
    return;
  }
  if (!G.over) {
    if (G.resumeHold > 0) { G.resumeHold -= dt; return; }
    G.time += dt;
    if (!G.over && G.time >= G.timeLimit) { G.time = G.timeLimit; gameOver(false, true); } // the time limit (waves extend it)
    { const remain = Math.max(0, Math.ceil(G.timeLimit - G.time)); if (remain !== G.lastSec) { G.lastSec = remain; const tp = $('timePill'); tp.textContent = '⏱ ' + remain; tp.style.color = remain <= 10 ? '#ff5040' : ''; } }
    if (G.graceT > 0) G.graceT -= dt;
    if (G.dashCd > 0) G.dashCd -= dt;
    if (G.dashT > 0) G.dashT -= dt;
    $('dashBtn').classList.toggle('cd', G.exhaustT > 0 || G.stamina <= 0);
    $('stamBar').style.width = G.stamina.toFixed(0) + '%';
    $('stamBar').style.background = G.exhaustT > 0 ? '#e23b2e' : '';
    const gr = !!grabTarget();
    if (gr !== G.grabReady) { G.grabReady = gr; $('grabBtn').classList.toggle('ready', gr); }
    // player input → world move vector (camera relative)
    let mx = 0, mz = 0;
    const cf = { x: Math.sin(G.camDir), z: Math.cos(G.camDir) };
    const cr = { x: -cf.z, z: cf.x };
    if (stick.on && (Math.abs(stick.dx) > 6 || Math.abs(stick.dy) > 6)) {
      const m = Math.hypot(stick.dx, stick.dy);
      const s = clamp(m / 34, 0.25, 1); // full speed at a 34px drag — small thumb movements are enough, the finger stays on the phone
      const sf = { x: Math.sin(G.camDir), z: Math.cos(G.camDir) }; // steering follows the CURRENT camera: after you swing the view, stick-right is screen-right (the old touch-start lock made it run the pre-look way — "右入力してるのに左に行く")
      const sr = { x: -sf.z, z: sf.x };
      mx = (sr.x * stick.dx + sf.x * -stick.dy) / m * s;
      mz = (sr.z * stick.dx + sf.z * -stick.dy) / m * s;
    } else {
      let kx = 0, kz = 0;
      if (keys['arrowup'] || keys['w']) kz += 1;
      if (keys['arrowdown'] || keys['s']) kz -= 1;
      if (keys['arrowleft'] || keys['a']) kx -= 1;
      if (keys['arrowright'] || keys['d']) kx += 1;
      if (kx || kz) {
        const m = Math.hypot(kx, kz);
        mx = (cr.x * kx + cf.x * kz) / m;
        mz = (cr.z * kx + cf.z * kz) / m;
      }
    }
    // right stick = camera orbit, applied incrementally in the pointermove handler (never swings on its own)
    const mm = Math.hypot(mx, mz);
    const mdObj = { get dir() { return p.moveDir; }, set dir(v) { p.moveDir = v; } };
    if (G.dashT > 0) {
      // committed lunge along the facing at dash start
      p.moveDir = G.dashDir;
      turnToward(p, G.dashDir, 18, dt);
      p.speed += clamp(p.baseSpeed * 1.5 - p.speed, -40 * dt, 34 * dt);
    } else if (mm > 0.01) {
      const moveHeading = Math.atan2(mx, mz);
      turnToward(mdObj, moveHeading, 16, dt); // tighter turning: the move direction swings round much faster
      turnToward(p, moveHeading, p.turn, dt); // the body faces where it runs
      let dAng = moveHeading - p.moveDir;
      while (dAng > Math.PI) dAng -= Math.PI * 2;
      while (dAng < -Math.PI) dAng += Math.PI * 2;
      const cutIn = Math.abs(dAng) > Math.PI / 2 ? 0.55 : 1; // reversing hard: bleed speed so the arc stays tight instead of swinging wide
      const target = (G.exhaustT > 0 ? Math.min(p.baseSpeed * 0.45, p.baseSpeed * clamp(mm, 0, 1)) : p.baseSpeed * clamp(mm, 0, 1)) * cutIn;
      p.speed += clamp(target - p.speed, -48 * dt, 38 * dt);
    } else {
      p.speed += clamp(0 - p.speed, -60 * dt, 38 * dt);
    }
    moveActor(p, dt, p.moveDir);
    if (G.exhaustT > 0) G.exhaustT -= dt;
    // stamina refills only while walking (gentle stick) or standing still — full-speed running just holds it
    if (G.dashT <= 0 && mm <= 0.55 && G.stamina < 100) G.stamina = Math.min(100, G.stamina + 15 * dt);
    // NPCs
    for (const a of G.actors) {
      if (a.id === 'p' || a.id === 't' || a.out) continue;
      a.thinkT -= dt;
      if (a.thinkT <= 0) { a.thinkT = 0.12; npcThink(a); }
      if (a.grabCd > 0) a.grabCd -= dt;
      // some people stop and stand around for a moment (never while fleeing or lunging)
      if (a.canPause && a.dashT <= 0) {
        if (a.pauseT > 0) { if (!a.flee) a.pauseT -= dt; }
        else if (!a.flee) { a.idleT -= dt; if (a.idleT <= 0) { a.pauseT = 1 + Math.random() * 1.6; a.idleT = 4 + Math.random() * 5; } }
      }
      // lunge: close behind a target -> dash at its tail (the only way to take it)
      if (a.dashT > 0) a.dashT -= dt;
      if (a.dashCd > 0) a.dashCd -= dt;
      if (a.hasTarget && !a.flee && !a.noDash && a.pauseT <= 0 && a.dashCd <= 0 && a.tgt && a.tgt.tail === 1 && !a.tgt.out) {
        const tp = tailPos(a.tgt);
        const d = Math.hypot(a.x - tp.x, a.z - tp.z);
        if (d < (a.lungeRange || 2.7) * (a.tgt.id === 'p' ? (G.exhaustT > 0 ? 1.5 : 1.2) : 1)) { // hunters commit to a lunge at the player from a bit further out — you should get caught sometimes
          const bf = fwd(a.tgt);
          const bx = a.x - a.tgt.x, bz = a.z - a.tgt.z, bd = Math.hypot(bx, bz) || 1;
          if ((bf.x * bx + bf.z * bz) / bd < -0.05 || d < 1.3) { a.dashT = 0.42; a.dashCd = (a.dashCdBase || 2.6) + Math.random() * (a.dashCdRand || 1.8); }
        }
      }
      if (a.hasTarget) {
        // near the target point, steer gently — full-rate turning at point-blank makes the heading tremble
        const td = Math.hypot(a.tx - a.x, a.tz - a.z);
        turnToward(a, Math.atan2(a.tx - a.x, a.tz - a.z), a.turn * clamp(td / 1.2, 0.25, 1), dt);
        const paused = a.pauseT > 0 && !a.flee;
        const target = paused ? 0 : a.baseSpeed * (a.flee ? 1.04 : 1) * (G.time > 60 ? 1.06 : 1) * (a.dashT > 0 ? (a.dashMul || 1.5) : 1);
        a.speed += clamp(target - a.speed, paused ? -30 * dt : -24 * dt, a.dashT > 0 ? 26 * dt : 12 * dt);
      } else {
        a.speed += clamp(0 - a.speed, -20 * dt, 20 * dt);
      }
      moveActor(a, dt);
    }
    if (p.grabCd > 0) p.grabCd -= dt;
    // separation
    const movers = G.actors.filter(a => a.id !== 't');
    for (let i = 0; i < movers.length; i++) for (let j = i + 1; j < movers.length; j++) {
      const A = movers[i], B = movers[j];
      const dx = B.x - A.x, dz = B.z - A.z, d = Math.hypot(dx, dz);
      const minD = ((A.sep || 0.72) + (B.sep || 0.72)) / 2;
      if (d > 0.001 && d < minD) {
        const push = (minD - d) / 2 * 0.35, ux = dx / d, uz = dz / d; // spring, not a snap — a full correction every frame trembles
        if (!A.out) { A.x -= ux * push; A.z -= uz * push; }
        if (!B.out) { B.x += ux * push; B.z += uz * push; }
        const mA = actorMargin(A), mB = actorMargin(B);
        A.x = clamp(A.x, -GYM_X + mA, GYM_X - mA); A.z = clamp(A.z, GYM_ZN + mA, GYM_Z - mA);
        B.x = clamp(B.x, -GYM_X + mB, GYM_X - mB); B.z = clamp(B.z, GYM_ZN + mB, GYM_Z - mB);
      }
    }
    checkGrabs();
    // a kid who lost their tail sits for ten seconds, then leaves the field
    if (G.actors.some(a => a.out && a.outT != null && G.time - a.outT >= 10)) G.actors = G.actors.filter(a => !(a.out && a.outT != null && G.time - a.outT >= 10));
    checkWaves();
    if (G.waveCd > 0) G.waveCd -= dt;
    if (G.annT > 0) { G.annT -= dt; if (G.annT <= 0) $('storyCap').classList.add('hidden'); }
    // danger vignette: hunter close behind the player
    let danger = 0;
    if (p.tail === 1) {
      const pf = fwd(p);
      for (const a of alive()) {
        if (a.id === 'p') continue;
        const dx = a.x - p.x, dz = a.z - p.z, d = Math.hypot(dx, dz);
        if (d < 4.6 && (pf.x * dx + pf.z * dz) / (d || 1) < -0.1) danger = Math.max(danger, (4.6 - d) / 4.6 * (a.dashT > 0 ? 1.5 : 0.55));
      }
    }
    $('danger').style.opacity = (danger * 0.9).toFixed(2);
  } else {
    $('danger').style.opacity = 0;
    for (const a of G.actors) { a.speed = 0; a.runF += (0 - a.runF) * Math.min(1, dt * 8); }
  }
}
let lastTs = 0, bootT = performance.now(), errShown = false;
function loop(ts) {
  requestAnimationFrame(loop);
  const rawDt = clamp((ts - lastTs) / 1000 || 0, 0, 0.05);
  lastTs = ts;
  if (!window.R3D) {
    if (!errShown && performance.now() - bootT > 9000) { errShown = true; $('loadErr').classList.remove('hidden'); }
    return;
  }
  // slow motion (the moment the player is caught): real seconds on slowT, everything else scales
  if (G.slowT > 0) G.slowT -= rawDt;
  G.timeScale = G.slowT > 0 ? 0.16 : 1;
  tick(rawDt * G.timeScale);
  R3D.frame(buildState());
}
requestAnimationFrame(loop);

/* ---------- wiring ---------- */
$('name1').value = store.get('shippo_name', '');
$('name1').addEventListener('input', () => store.set('shippo_name', $('name1').value.trim().slice(0, 10)));
$('startBtn').onclick = () => { ac(); if (!G.playedOnce) startStory(); else startGame(); };
$('againBtn').onclick = () => startGame();
$('resTitleBtn').onclick = () => backToTitle();
$('quitBtn').onclick = () => backToTitle();
$('rankBtn').onclick = () => { showScreen('rank'); loadRank(); };
$('rankBackBtn').onclick = () => showScreen('title');
$('skipBtn').onclick = () => startGame();
wireImgShare();
refreshTitleBest();
showScreen('title');
</script>
